<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Draw Game</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Class Lottery Arena</p>
          <h1>조 추첨 게임</h1>
          <p class="subtitle">조 이름을 넣고 시작하면, 한 번 뽑힌 조는 자동으로 제외됩니다. 필요하면 언제든 명단을 직접 수정할 수 있습니다.</p>
        </div>
        <div class="scorebar" aria-label="추첨 상태">
          <div><span class="score-label">대기</span><strong id="ready-count">0</strong></div>
          <div><span class="score-label">뽑힘</span><strong id="picked-count">0</strong></div>
          <div><span class="score-label">전체</span><strong id="total-count">0</strong></div>
        </div>
      </section>

      <section class="arena-grid">
        <aside class="setup-panel">
          <div class="panel-head"><p class="eyebrow">Setup</p><h2>명단 입력</h2></div>
          <label for="name-input">조 이름을 한 줄에 하나씩 입력</label>
          <textarea id="name-input" spellcheck="false" placeholder="1조&#10;2조&#10;3조&#10;AI 탐험대&#10;데이터 히어로"></textarea>
          <div class="button-grid">
            <button id="load-button" type="button">명단 불러오기</button>
            <button id="sample-button" type="button" class="secondary">예시 45개</button>
          </div>
          <p class="hint">브라우저에 자동 저장됩니다. 새로고침해도 대기/뽑힘 상태가 유지됩니다.</p>
        </aside>

        <section class="draw-panel">
          <div class="machine" aria-live="polite">
            <div class="machine-top"><span></span><span></span><span></span></div>
            <div class="reel-window">
              <div id="reel" class="reel">READY</div>
              <canvas id="spark-canvas" aria-hidden="true"></canvas>
            </div>
            <div class="winner-card" id="winner-card"><p>이번에 뽑힌 조</p><strong id="winner-name">아직 없음</strong></div>
          </div>
          <div class="draw-actions">
            <button id="draw-button" type="button" class="draw-button">추첨 시작</button>
            <button id="undo-button" type="button" class="secondary">방금 결과 되돌리기</button>
            <button id="reset-button" type="button" class="danger">전체 초기화</button>
          </div>
        </section>
      </section>

      <section class="manager-grid">
        <article class="list-panel">
          <div class="panel-head row"><div><p class="eyebrow">Can Draw</p><h2>다시 뽑힐 수 있는 명단</h2></div><button id="save-ready" type="button" class="mini">저장</button></div>
          <textarea id="ready-editor" spellcheck="false"></textarea>
        </article>
        <article class="list-panel">
          <div class="panel-head row"><div><p class="eyebrow">Already Picked</p><h2>이미 뽑힌 명단</h2></div><button id="save-picked" type="button" class="mini">저장</button></div>
          <textarea id="picked-editor" spellcheck="false"></textarea>
        </article>
      </section>

      <section class="history-panel">
        <div class="panel-head row"><div><p class="eyebrow">History</p><h2>추첨 기록</h2></div><button id="clear-history" type="button" class="mini secondary">기록 지우기</button></div>
        <ol id="history-list" class="history-list"></ol>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./main.js"></script>
  </body>
</html>
